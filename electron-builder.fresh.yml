# Fresh-output build config: use when release/win-unpacked is locked or the
# safe-delete guard blocks electron-builder's cleanup of the old output dir.
#   npx electron-builder --win portable -c electron-builder.fresh.yml
# Produces release-fresh/ instead of release/. Everything else mirrors
# electron-builder.yml. Long-term useful as the "rebuild channel".
appId: com.claudeworkbench.app
productName: ClaudeWorkbench
copyright: Copyright (c) 2026
directories:
  output: release-fresh
  buildResources: resources
# 显式文件清单：默认模式会把 release/ 等历史输出目录也打进 asar（二次构建时 asar 膨胀 ~565MB）。
# node_modules 由 electron-builder 按 package.json 依赖树自动剪枝（electron 本体不打包）。
files:
  - out/**/*
  - package.json
  - node_modules/**/*
  - '!release/**/*'
  - '!release-fresh/**/*'
  - '!**/*.{map,ts,md,markdown}'
asar: true
asarUnpack:
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**'
compression: normal
npmRebuild: false
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-portable.${ext}
