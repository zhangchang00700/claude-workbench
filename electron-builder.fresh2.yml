# Fresh-output build config (channel 2): use when release-fresh is locked by
# AV/indexer handles. Produces release-fresh2/. Mirrors electron-builder.fresh.yml.
appId: com.claudeworkbench.app
productName: ClaudeWorkbench
copyright: Copyright (c) 2026
directories:
  output: release-fresh2
  buildResources: resources
# Offline mode: use the already-installed electron dist as the framework source.
# Skips download+extract+rename, which races with Defender real-time scanning
# (EPERM on win-unpacked.tmp -> win-unpacked rename).
electronDist: node_modules/electron/dist
# Explicit file list: default patterns pack historical output dirs (release/, release-fresh/)
# into the asar on second builds (~565MB bloat). node_modules is auto-pruned to the
# production dependency tree by electron-builder (the electron package itself is not packed).
files:
  - out/**/*
  - package.json
  - node_modules/**/*
  - '!release/**/*'
  - '!release-fresh/**/*'
  - '!release-fresh2/**/*'
  - '!**/*.{map,ts,md,markdown}'
asar: true
asarUnpack:
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**'
compression: normal
npmRebuild: false
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-portable.${ext}
